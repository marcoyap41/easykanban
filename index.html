<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyKanban – Task Management Tool</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="black" data-view="columns" data-header="solid" data-glass-lanes="off" data-glass-cards="off">
<div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
<div class="app">
    <aside class="rail" id="rail">
        <a href="index.html" class="brand"><i></i>EasyKanban</a>
        <section>
            <div class="rail-head"><h3>Boards</h3><button class="link" onclick="kanban.openBoardManager()">Manage</button></div>
            <div id="rail-boards"></div>
            <button class="rail-item plus" onclick="kanban.createNewBoard()">+ New board</button>
        </section>
        <section>
            <div class="rail-head"><h3>Stages</h3></div>
            <nav id="rail-lanes"></nav>
        </section>
        <section>
            <div class="rail-head"><h3>Display</h3></div>
            <button class="rail-item" id="theme-button" onclick="kanban.cycleTheme()"><span class="g">Theme</span><em class="v"></em></button>
            <button class="rail-item" id="density-button" onclick="kanban.cycleDensity()"><span class="g">Detail</span><em class="v"></em></button>
            <button class="rail-item" id="layout-button" onclick="kanban.cycleColumnLayout()"><span class="g">Card size</span><em class="v"></em></button>
            <button class="rail-item" id="wallpaper-button" onclick="kanban.openWallpaperModal()"><span class="g">Wallpaper</span><em class="v"></em></button>
            <button class="rail-item" id="autosave-button" onclick="kanban.toggleAutosave()"><span class="g">Autosave</span><em class="v"></em></button>
            <button class="rail-item" onclick="kanban.exportBoard()"><span class="g">Export board</span></button>
            <button class="rail-item" onclick="kanban.importBoard()"><span class="g">Import board</span></button>
        </section>
        <footer class="rail-foot">Copyright © 2026 Marco Christian.</footer>
    </aside>

    <div class="stage">
        <header class="bar">
            <button class="rail-toggle" onclick="toggleRail()" aria-label="Open sidebar">Menu</button>
            <input type="text" class="title-input" id="board-name" placeholder="Untitled board" maxlength="50" aria-label="Board name">
            <span class="summary" id="summary"></span>
            <div class="view-toggle" role="group" aria-label="Board layout">
                <button type="button" data-view-btn="columns" aria-pressed="false" onclick="kanban.changeView('columns')" title="Vertical columns">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="4" height="12" rx="1"/><rect x="6" y="2" width="4" height="8" rx="1"/><rect x="11" y="2" width="4" height="10" rx="1"/></svg>Columns
                </button>
                <button type="button" data-view-btn="lanes" aria-pressed="true" onclick="kanban.changeView('lanes')" title="Horizontal lanes">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="1" width="12" height="4" rx="1"/><rect x="1" y="6" width="8" height="4" rx="1"/><rect x="1" y="11" width="14" height="4" rx="1"/></svg>Lanes
                </button>
            </div>
            <input type="search" class="find" id="search-input" placeholder="Find a task" aria-label="Find a task">
            <button class="btn" id="save-button" onclick="kanban.saveToStorage()">Save</button>
        </header>
        <main class="board"></main>
    </div>
</div>

<div id="task-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-title">New task</h2>
            <button type="button" class="modal-close" onclick="kanban.closeTaskModal()" aria-label="Close">×</button>
        </div>
        <form id="task-form" onsubmit="kanban.saveTask(event)">
            <input type="text" class="form-input title-field" id="task-title" required maxlength="100" placeholder="What needs to be done?" aria-label="Task title">
            <div class="form-group">
                <textarea class="form-textarea" id="task-description" rows="3" maxlength="500" placeholder="Notes" aria-label="Notes"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label" for="task-priority">Priority</label>
                <select class="form-select" id="task-priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="task-difficulty">Difficulty</label>
                    <input type="range" class="slider" id="task-difficulty" min="1" max="5" value="3">
                    <div class="slider-value">3 / 5</div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="task-progress">Progress</label>
                    <input type="range" class="slider" id="task-progress" min="0" max="100" value="0" step="10">
                    <div class="slider-value">0%</div>
                </div>
            </div>
            <div class="form-group">
                <span class="form-label">Color tag</span>
                <div class="color-picker-container">
                    <button type="button" class="color-option" data-color="" title="No color" onclick="kanban.selectTaskColor('')"><span class="color-circle no-color">✕</span></button>
                    <button type="button" class="color-option" data-color="#ef4444" title="Red" onclick="kanban.selectTaskColor('#ef4444')"><span class="color-circle" style="background:#ef4444"></span></button>
                    <button type="button" class="color-option" data-color="#f97316" title="Orange" onclick="kanban.selectTaskColor('#f97316')"><span class="color-circle" style="background:#f97316"></span></button>
                    <button type="button" class="color-option" data-color="#eab308" title="Yellow" onclick="kanban.selectTaskColor('#eab308')"><span class="color-circle" style="background:#eab308"></span></button>
                    <button type="button" class="color-option" data-color="#22c55e" title="Green" onclick="kanban.selectTaskColor('#22c55e')"><span class="color-circle" style="background:#22c55e"></span></button>
                    <button type="button" class="color-option" data-color="#3b82f6" title="Blue" onclick="kanban.selectTaskColor('#3b82f6')"><span class="color-circle" style="background:#3b82f6"></span></button>
                    <button type="button" class="color-option" data-color="#a855f7" title="Purple" onclick="kanban.selectTaskColor('#a855f7')"><span class="color-circle" style="background:#a855f7"></span></button>
                    <button type="button" class="color-option" data-color="#ec4899" title="Pink" onclick="kanban.selectTaskColor('#ec4899')"><span class="color-circle" style="background:#ec4899"></span></button>
                    <button type="button" class="color-option" data-color="#6b7280" title="Gray" onclick="kanban.selectTaskColor('#6b7280')"><span class="color-circle" style="background:#6b7280"></span></button>
                    <button type="button" class="color-option" title="Custom color" onclick="kanban.openCustomColorPicker()"><span class="color-circle custom">+</span></button>
                </div>
                <input type="hidden" id="task-color" value="#3b82f6">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="kanban.closeTaskModal()">Cancel</button>
                <button type="submit" class="btn">Save task</button>
            </div>
        </form>
    </div>
</div>

<div id="wallpaper-modal" class="modal">
    <div class="modal-content wp-content">
        <div class="modal-header">
            <h2 class="modal-title">Wallpaper</h2>
            <button type="button" class="modal-close" onclick="kanban.closeWallpaperModal()" aria-label="Close">×</button>
        </div>
        <p class="wp-hint" id="wp-hint"></p>
        <div class="wp-frame" id="wp-frame">
            <img id="wp-img" alt="" draggable="false">
            <div class="wp-empty" id="wp-empty">No image yet.<br>Choose one to crop it to the board area.</div>
        </div>
        <div class="wp-zoom" id="wp-zoom-row">
            <label for="wp-zoom">Zoom</label>
            <input type="range" class="slider" id="wp-zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
        </div>
        <label class="wp-toggle" for="header-blur-toggle">
            <input type="checkbox" id="header-blur-toggle" onchange="kanban.setHeaderBlur(this.checked)">
            <span><b>Blurry header bar</b><small>Semi-transparent with a frosted-glass blur</small></span>
        </label>
        <label class="wp-toggle" for="glass-lanes-toggle">
            <input type="checkbox" id="glass-lanes-toggle" onchange="kanban.setGlass('lanes', this.checked)">
            <span><b>Translucent stages</b><small>Lets the wallpaper show through the stage panels</small></span>
        </label>
        <label class="wp-toggle" for="glass-cards-toggle">
            <input type="checkbox" id="glass-cards-toggle" onchange="kanban.setGlass('cards', this.checked)">
            <span><b>Translucent cards</b><small>Lets the wallpaper show through task cards</small></span>
        </label>
        <div class="wp-zoom" id="glass-opacity-row">
            <label for="glass-opacity">Opacity</label>
            <input type="range" class="slider" id="glass-opacity" min="20" max="95" step="1" value="55" aria-label="Panel and card opacity" oninput="kanban.setGlassOpacity(this.value)">
            <output id="glass-opacity-val">55%</output>
        </div>
        <div class="wp-zoom" id="header-blur-row">
            <label for="header-blur-amount">Header blur</label>
            <input type="range" class="slider" id="header-blur-amount" min="0" max="30" step="1" value="16" aria-label="Blur amount for the header bar" oninput="kanban.setGlassBlur('header', this.value)">
            <output id="header-blur-val">16px</output>
        </div>
        <div class="wp-zoom" id="stage-blur-row">
            <label for="stage-blur-amount">Stage blur</label>
            <input type="range" class="slider" id="stage-blur-amount" min="0" max="30" step="1" value="10" aria-label="Blur amount for the stages" oninput="kanban.setGlassBlur('stage', this.value)">
            <output id="stage-blur-val">10px</output>
        </div>
        <div class="modal-actions wp-actions">
            <button type="button" class="btn btn-secondary wp-remove" id="wp-remove" onclick="kanban.removeWallpaper()">Remove</button>
            <button type="button" class="btn btn-secondary" id="wp-choose" onclick="document.getElementById('wp-file').click()">Choose image</button>
            <button type="button" class="btn" id="wp-apply" onclick="kanban.saveWallpaper()" disabled>Apply</button>
        </div>
        <input type="file" id="wp-file" accept="image/*" style="display:none" onchange="kanban.handleWallpaperFile(event)">
    </div>
</div>

<input type="file" id="import-input" accept=".json" style="display:none" onchange="kanban.handleImport(event)">
<div id="toast" class="toast" role="status"></div>

<script src="kanban.js"></script>
<script>
function toggleRail(){document.body.classList.toggle('rail-open')}
document.addEventListener('click',e=>{if(document.body.classList.contains('rail-open')&&!e.target.closest('.rail,.rail-toggle'))document.body.classList.remove('rail-open')});
</script>
</body>
</html>
